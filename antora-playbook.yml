site:
  title: Kroki example$ demo
  start_page: kroki-antora-example::index.adoc

antora:
  extensions:
    - '@antora/pdf-extension'
    # PDF export: export the example$ diagram sources to disk and point the plantuml:: macros
    # at them, so asciidoctor-pdf + the asciidoctor-kroki gem resolve the relative includes (see README)
    - require: ./extensions/antora-assembler-kroki.js
      mode: export

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true

output:
  dir: ./build/site
