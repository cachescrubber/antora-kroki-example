site:
  title: Kroki example$ demo
  start_page: kroki-antora-example::index.adoc

antora:
  extensions:
    - '@antora/pdf-extension'

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true

output:
  dir: ./build/site
